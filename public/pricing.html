<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pricing — Peachy</title>
<meta name="description" content="One flat payment covers 12 weeks of weekly title optimization on 5 YouTube videos. No subscription.">
<link rel="canonical" href="https://pea.dpdns.org/pricing.html">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/img/peachy-icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/css/styles.css">
</head>
<body>
<nav class="nav"><div class="wrap nav-inner">
  <a class="brand" href="/"><img src="/img/peachy-icon.svg" alt="Peachy logo"><span>Peachy</span></a>
  <div class="nav-right">
    <a class="nav-icon" href="/pricing.html">$<span class="popover" id="nav-price-popover"><strong>See pricing</strong></span></a>
    <a class="nav-icon" id="nav-account-target" href="/#start"><img src="/img/user-icon.svg" alt="Account" class="nav-user-icon"><span class="popover">Not signed in yet</span></a>
  </div>
</div></nav>

<main class="wrap">
  <section class="card" style="max-width:520px;margin:40px auto;text-align:center;">
    <h1>One job. One price.</h1>
    <div id="price-block">
      <p style="font-size:2.4rem;font-family:Fraunces,serif;color:var(--accent);margin:12px 0;">…</p>
    </div>
    <ul style="text-align:left;margin:24px 0;line-height:2;">
      <li>5 videos of your choice</li>
      <li>12 weekly title updates (3 months)</li>
      <li>Applied automatically to YouTube</li>
      <li>Weekly email digest with one-click revert</li>
      <li>Cancel future runs anytime, no refund</li>
    </ul>
    <a class="btn" href="/wizard.html">Start a job</a>
  </section>
</main>
<footer class="wrap">© Peachy. <a href="/privacy.html">Privacy</a> · <a href="/terms.html">Terms</a></footer>
<script src="/js/nav.js"></script>
<script>
(async () => {
  const res = await fetch("/api/pricing");
  const p = await res.json();
  const el = document.getElementById("price-block");
  if (p.launchActive) {
    const ends = new Date(p.endsAt).toLocaleDateString(undefined, { month: "long", day: "numeric" });
    el.innerHTML = `
      <p style="margin:12px 0;">
        <span style="text-decoration:line-through;color:var(--ink-dim);font-size:1.3rem;">$${p.regularPrice}</span>
        <span style="font-size:2.4rem;font-family:Fraunces,serif;color:var(--accent);margin-left:8px;">$${p.launchPrice}</span>
      </p>
      <p style="color:var(--ink-dim);font-size:.9rem;">Launch price — good through ${ends}. $${p.regularPrice} after.</p>`;
  } else {
    el.innerHTML = `<p style="font-size:2.4rem;font-family:Fraunces,serif;color:var(--accent);margin:12px 0;">$${p.regularPrice}</p>`;
  }
})();
</script>
</body>
</html>
